<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0c"><title>Null — Launch Studio</title>
  <link rel="icon" href="assets/null-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"><link rel="stylesheet" href="demo.css">
  <script src="_vendor/gsap.min.js"></script>
  <script src="_vendor/mp4-muxer.js"></script>
  <script type="module" src="demo.mjs"></script>
</head>
<body>
<header class="bar">
  <a class="logo" href="/">null<span>.</span></a>
  <span class="bar-meta" id="bar-meta"></span>
  <a class="bar-link" href="/editor">Open editor</a>
  <div class="download">
    <button class="download-button" id="download" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span id="download-label">Download</span></button>
    <div class="download-menu" id="download-menu" role="menu" hidden>
      <button role="menuitem" id="download-all"><strong>Whole preview</strong><span>Final film and its drafts in one MP4</span></button>
      <button role="menuitem" id="download-final"><strong>Final film only</strong><span>The original reference video</span></button>
    </div>
  </div>
</header>
<main class="stage" id="stage">
  <section class="final" aria-label="Final video">
    <video id="final-video" muted playsinline loop preload="auto"></video>
    <button class="final-toggle" id="final-toggle" aria-label="Pause"><span class="final-icon" aria-hidden="true"></span></button>
    <button class="sound" id="sound" aria-label="Unmute" aria-pressed="false">Sound off</button>
  </section>
  <section class="strip" id="strip" aria-label="Sections">
    <div class="scraps" id="scraps"></div>
    <div class="playhead" id="playhead"><span></span></div>
  </section>
  <div class="times"><strong id="time-now">0:00.0</strong><span id="time-total">0:00</span></div>
  <input class="seek" id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Seek">
</main>
<section class="library" aria-labelledby="library-title">
  <div class="library-head"><h2 id="library-title">All videos</h2><span id="library-count"></span></div>
  <div class="library-grid" id="library"></div>
</section>
</body>
</html>
