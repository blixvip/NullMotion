<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Integrations Grid</title>
<script src="../_vendor/gsap.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
  #root {
    position: relative; width: 1920px; height: 1080px; background: transparent;
    overflow: hidden; font-family: "Inter", -apple-system, "SF Pro Display", system-ui, Arial, sans-serif;
  }
  #grid {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: grid; grid-template-columns: repeat(3, 480px); gap: 28px;
  }
  .cell {
    display: flex; align-items: center; gap: 22px; padding: 26px 28px; border-radius: 22px;
    background: linear-gradient(180deg, #1b1b1f 0%, #131316 100%);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 22px 50px rgba(0,0,0,0.5);
    will-change: transform, opacity;
  }
  .ic {
    width: 72px; height: 72px; flex: none; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #232327 0%, #0d0d0f 100%);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 0 44px rgba(190,190,200,0.20), 0 12px 26px rgba(0,0,0,0.55);
  }
  .ic svg { width: 38px; height: 38px; }
  .body { flex: 1; min-width: 0; }
  .nm { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: #ECECEE; }
  .ds { font-size: 16px; color: var(--muted, #8a8a92); margin-top: 4px; line-height: 1.3; }
  .add {
    width: 44px; height: 44px; flex: none; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 26px; color: #cfcfd4;
    background: linear-gradient(180deg, #26262b, #161618); border: 1px solid rgba(255,255,255,0.10);
  }
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080">
    <div id="grid"></div>
  </div>
  <script>
    // swap these for your own integrations (name / desc / glyph)
    const APPS = [
      ["Atlassian", "Jira issues & Confluence", '<path d="M7 20 12 8l5 12H7z" stroke="#cfe0ff" stroke-width="1.6" fill="none"/>'],
      ["Linear",    "Track issues & projects",  '<path d="M5 19 19 5M9 19 19 9M5 15 15 5" stroke="#dcdce2" stroke-width="1.6"/>'],
      ["Miro",      "Boards & diagrams",        '<path d="M7 4v16M12 4v16M17 4v16" stroke="#e8e8ee" stroke-width="2.2"/>'],
      ["Shopify",   "Manage your store",        '<path d="M8 7l4-2 4 2v10l-4 2-4-2V7z" stroke="#cfe0d6" stroke-width="1.6" fill="none"/>'],
      ["Notion",    "Pages & databases",        '<rect x="6" y="5" width="12" height="14" rx="2" stroke="#e6e6ea" stroke-width="1.6"/><path d="M9 9h6M9 12h6" stroke="#e6e6ea" stroke-width="1.4"/>'],
      ["Canva",     "Designs & graphics",       '<circle cx="12" cy="12" r="6.5" stroke="#cfd6ff" stroke-width="1.8"/>'],
    ];
    const grid = document.getElementById("grid");
    APPS.forEach((a, i) => {
      const c = document.createElement("div");
      c.className = "cell clip";
      c.setAttribute("data-start","0"); c.setAttribute("data-duration","5"); c.setAttribute("data-track-index", i);
      c.innerHTML = `<div class="ic"><svg viewBox="0 0 24 24" fill="none">${a[2]}</svg></div>
        <div class="body"><div class="nm">${a[0]}</div><div class="ds">${a[1]}</div></div>
        <div class="add">+</div>`;
      grid.appendChild(c);
    });

    const tl = gsap.timeline({ paused: true, defaults: { ease: "power4.out" } });
    tl.from(".cell", { y: 40, opacity: 0, scale: 0.94, duration: 0.7, stagger: 0.1 }, 0.1);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    if (location.hash === "#play") { tl.repeat(-1).repeatDelay(1.0).play(); }
  </script>
</body>
</html>
