<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Showreel Notify</title>
<script src="../_vendor/gsap.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
  #root {
    position: relative; width: 1080px; height: 1920px; background: transparent;
    overflow: hidden; font-family: "Inter", -apple-system, "SF Pro Display", system-ui, Arial, sans-serif;
  }
  /* glowing top + bottom kinetic words */
  .big {
    position: absolute; left: 50%; transform: translateX(-50%); text-align: center;
    font-size: 150px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.95;
    background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 45%, #8f8f93 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(220,220,235,0.25); will-change: transform, opacity;
  }
  #top { top: 250px; }
  #top small { display: block; font-size: 64px; font-weight: 500; letter-spacing: 0.02em; -webkit-text-fill-color: #8a8a92; margin-top: 10px; }
  #year { bottom: 250px; font-size: 200px; }

  /* phone in the center showing a notification */
  #phone {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 470px; height: 940px; border-radius: 64px; padding: 12px;
    background: linear-gradient(150deg, #2a2a2f 0%, #0c0c0e 60%); border: 1px solid rgba(255,255,255,0.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 50px 100px rgba(0,0,0,0.6); will-change: transform, opacity;
  }
  #pscreen { width: 100%; height: 100%; border-radius: 52px; background: linear-gradient(180deg, #15151a, #0a0a0c); overflow: hidden; position: relative; }
  /* glassy notification toast */
  #toast {
    position: absolute; left: 24px; right: 24px; top: 300px;
    display: flex; align-items: center; gap: 16px; padding: 20px 22px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(40,40,46,0.92), rgba(22,22,26,0.92));
    border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 24px 50px rgba(0,0,0,0.5); will-change: transform, opacity;
  }
  #toast .av { width: 64px; height: 64px; border-radius: 16px; flex: none; background: linear-gradient(160deg,#3a3a40,#0d0d0f); border: 1px solid rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; }
  #toast .av svg { width: 34px; height: 34px; }
  #toast .tx { flex: 1; min-width: 0; }
  #toast .tx b { display: block; font-size: 24px; color: #fff; font-weight: 600; }
  #toast .tx p { margin: 4px 0 0; font-size: 22px; color: #b9b9bd; }
  #toast .badge { position: absolute; top: -10px; right: -8px; width: 34px; height: 34px; border-radius: 50%; background: #ff4b4b; color: #fff; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(0,0,0,0.5); }
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="5" data-track-index="0" data-width="1080" data-height="1920">
    <div id="top" class="big clip" data-start="0" data-duration="5" data-track-index="0">VIRAL<small>content</small></div>

    <div id="phone" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div id="pscreen">
        <div id="toast">
          <div class="av"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="3.4" stroke="#cfe0d6" stroke-width="1.6"/><path d="M5 19c1.5-3 4-4 7-4s5.5 1 7 4" stroke="#cfe0d6" stroke-width="1.6"/></svg></div>
          <div class="tx"><b>+49 123 456 7890</b><p>I need a creator!</p></div>
          <div class="badge">1</div>
        </div>
      </div>
    </div>

    <div id="year" class="big clip" data-start="0" data-duration="5" data-track-index="2">2025</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from("#phone", { y: 80, opacity: 0, scale: 0.94, duration: 0.9, ease: "power4.out" }, 0.1);
    tl.from("#top", { y: -50, opacity: 0, duration: 0.8, ease: "power4.out" }, 0.35);
    tl.from("#year", { y: 50, opacity: 0, duration: 0.8, ease: "power4.out" }, 0.5);
    // notification drops in with a bounce
    tl.from("#toast", { y: -120, opacity: 0, duration: 0.7, ease: "back.out(1.7)" }, 1.1);
    tl.from("#toast .badge", { scale: 0, duration: 0.4, ease: "back.out(2.4)" }, 1.5);
    // gentle idle float on the phone
    tl.to("#phone", { y: "-=20", duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.6);

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    if (location.hash === "#play") { tl.play(); }
  </script>
</body>
</html>
